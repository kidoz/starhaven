site_name: StarHaven Documentation
site_description: Compatibility and engine documentation for StarHaven
repo_url: https://github.com/kidoz/starhaven
repo_name: kidoz/starhaven
edit_uri: edit/main/docs/
strict: true

theme:
  name: mkdocs
  color_mode: auto
  user_color_mode_toggle: true

nav:
  - Home: index.md
  - Open-question register: open-questions.md
  - Contributing:
      - Documentation standard: contributing/documentation-standard.md
  - File formats:
      - LOD archives: formats/lod.md
      - Games.lod: formats/games-lod.md
      - Bitmaps: formats/bitmap.md
      - Sprites: formats/sprite.md
      - Bitmap fonts: formats/font.md
      - Outdoor maps: formats/odm.md
      - Outdoor terrain: formats/odm-terrain.md
      - Outdoor models: formats/odm-models.md
      - Model vertices: formats/odm-model-mesh.md
      - Model facets: formats/odm-model-facets.md
      - Indoor maps: formats/blv.md
      - Event data: formats/event-data.md
      - Event tables: formats/event-tables.md
      - Event actors: formats/event-actors.md
      - Event sprite objects: formats/event-objects.md
      - Object descriptor table: formats/dobjlist.md
      - Chest appearance table: formats/dchest.md
      - Overlay table: formats/doverlay.md
      - Portrait frame table: formats/dpft.md
      - Decoration frame table: formats/dift.md
      - Items and item instances: formats/items.md
      - Outdoor decorations: formats/odm-decorations.md
      - Outdoor tile index: formats/odm-tile-index.md
      - Portraits and paperdolls: formats/portraits.md
      - Map event scripts: formats/map-events.md
      - Ground tiles: formats/dtile.md
      - Monster table: formats/dmonlist.md
      - Design data tables: formats/text-tables.md
      - Sprite frame table: formats/dsft.md
      - Sound table: formats/dsounds.md
      - VID containers: formats/vid.md
      - Smacker video: formats/smacker.md
      - Sound archive: formats/snd.md
      - Texture frame table: formats/dtft.md
      - Interface panels: formats/interface-panels.md
      - Paperdoll: formats/paperdoll.md
      - The player record: formats/player-record.md
      - The party record: formats/party-record.md
      - Character property setter: formats/character-properties.md
      - Fixed-point math: formats/fixed-point.md
      - The spell switch: formats/spell-switch.md
      - Weapon specials: formats/weapon-specials.md
  - Rendering:
      - Software rasterizer: rendering/software-rasterizer.md
      - Terrain coloring: rendering/terrain-coloring.md
      - Collision and movement: rendering/collision.md
      - Renderer performance: rendering/performance.md

markdown_extensions:
  - toc:
      permalink: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

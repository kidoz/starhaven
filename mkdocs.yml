site_name: StarHaven Documentation
site_description: Compatibility and engine documentation for StarHaven
repo_url: https://github.com/kidoz/starhaven
repo_name: kidoz/starhaven
edit_uri: edit/main/docs/

theme:
  name: mkdocs
  color_mode: auto
  user_color_mode_toggle: true

nav:
  - Home: index.md
  - File formats:
      - LOD archives: formats/lod.md
      - Games.lod: formats/games-lod.md
      - Bitmaps: formats/bitmap.md
      - Sprites: formats/sprite.md
      - Outdoor maps: formats/odm.md
      - Outdoor terrain: formats/odm-terrain.md
      - Outdoor models: formats/odm-models.md
      - Model vertices: formats/odm-model-mesh.md
      - Model facets: formats/odm-model-facets.md
      - Indoor maps: formats/blv.md
      - Event data: formats/event-data.md
      - Event tables: formats/event-tables.md
      - Ground tiles: formats/dtile.md
      - VID containers: formats/vid.md
      - Smacker video: formats/smacker.md
  - Rendering:
      - Software rasterizer: rendering/software-rasterizer.md
      - Terrain coloring: rendering/terrain-coloring.md

markdown_extensions:
  - toc:
      permalink: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
